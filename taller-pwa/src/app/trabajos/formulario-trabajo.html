@if (guardando()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="contenedor">
  <div class="fila cabecera">
    <a matIconButton routerLink="/trabajos" aria-label="Volver">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h2 class="crece">Nuevo trabajo</h2>
  </div>

  <p class="explicacion">
    <mat-icon>info</mat-icon>
    <span>
      Apunta lo que tengas. Puedes guardarlo a medias y terminarlo otro día:
      hasta que no lo envíes, sigue siendo un borrador.
    </span>
  </p>

  <mat-card>
    <mat-card-content>
      <form (ngSubmit)="guardar()">
        <app-selector-maestro
          etiqueta="Cliente"
          [opciones]="maestros.clientes()"
          [(valor)]="clienteId"
          [deshabilitado]="guardando()"
        />

        <app-selector-maestro
          etiqueta="Trabajador"
          [opciones]="maestros.trabajadores()"
          [(valor)]="trabajadorId"
          [deshabilitado]="guardando()"
        />

        <mat-form-field appearance="outline">
          <mat-label>Qué se ha hecho</mat-label>
          <textarea matInput name="descripcion" rows="4" [ngModel]="descripcion()" (ngModelChange)="descripcion.set($event)" [disabled]="guardando()"></textarea>
        </mat-form-field>

        <h3 class="titulo-seccion">Materiales</h3>
        <app-filas-materiales
          [deshabilitado]="guardando()"
          (cambio)="materiales.set($event)"
        />

        <mat-form-field appearance="outline">
          <mat-label>Horas</mat-label>
          <!--
            type="text" con inputmode="decimal", NO type="number".
            Con type="number" Angular emite un número por ngModelChange, no
            texto, y el resto del componente trabaja con texto: el valor se veía
            escrito en pantalla pero la aplicación seguía creyendo que faltaba.
            Además inputmode="decimal" abre igualmente el teclado numérico en la
            tablet, y así se admite escribir "2,5" con coma, que es como se
            teclea aquí.
          -->
          <input
            matInput
            name="horas"
            type="text"
            inputmode="decimal"
            placeholder="2,5"
            [ngModel]="horas()"
            (ngModelChange)="horas.set($event)"
            [disabled]="guardando()"
          />
          <span matTextSuffix>h</span>
          @if (errorHoras()) {
            <mat-error>{{ errorHoras() }}</mat-error>
          }
        </mat-form-field>

        <div class="fila-fin acciones">
          <a matButton routerLink="/trabajos">Cancelar</a>
          <button matButton="filled" type="submit" [disabled]="guardando()">
            {{ guardando() ? 'Guardando…' : 'Guardar borrador' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

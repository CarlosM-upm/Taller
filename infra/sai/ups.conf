# /etc/nut/ups.conf
#
# El SAI del taller.
#
# AJUSTAR CON EL APARATO DELANTE. Ejecuta primero:
#
#     sudo nut-scanner -U
#
# y copia aquí el "driver" y el "port" que salgan. La mayoría de SAI USB
# domésticos y de oficina (APC, Eaton, Salicru, Riello, Cyberpower…) usan
# usbhid-ups con port = auto, que es lo que se deja puesto; pero hay modelos
# con driver propio (blazer_usb, nutdrv_qx…), y con el driver equivocado el
# servicio arranca y no ve nada.

[taller]
    driver = usbhid-ups
    port = auto
    desc = "SAI del mini-PC del taller"

    # Si al arrancar el driver se queja de permisos o de que el aparato está
    # ocupado, suele bastar con desenchufar y volver a enchufar el USB.
    # Si el modelo lo necesita, aquí se añaden vendorid/productid.

# /etc/nut/upsmon.conf
#
# Qué hacer cuando se va la luz.
#
# La regla del taller: un microcorte NO debe apagar el servidor. Que se vaya
# la luz un segundo al arrancar una máquina es normal, y apagar el mini-PC por
# eso da más problemas que el propio corte. Por eso la decisión de apagar no
# se toma aquí sino en upssched.conf, que espera unos minutos antes de actuar.
#
# CAMBIAR la contraseña para que coincida con upsd.users.

MONITOR taller@localhost 1 vigilante cambiame-tambien primary

MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
DEADTIME 15

# Todos los avisos se encaminan a upssched, que es quien lleva los temporizadores.
NOTIFYCMD /usr/sbin/upssched

# EXEC = se lo pasa a NOTIFYCMD;  SYSLOG = queda escrito en el registro.
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
NOTIFYFLAG FSD      SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG
NOTIFYFLAG COMMOK   SYSLOG
NOTIFYFLAG SHUTDOWN SYSLOG+EXEC

# Con la batería baja no se espera a nada: se apaga ya.
# El apagado limpio lo hace systemd al parar las unidades: primero
# herreria.service (Java recibe SIGTERM y cierra) y después
# herreria-bd.service, que hace "docker compose stop" y deja PostgreSQL
# cerrado en condiciones.

# /etc/nut/upssched.conf
#
# Aquí está el margen para los microcortes.
#
# Al irse la luz (ONBATT) se arranca un temporizador de 3 minutos. Si la luz
# vuelve antes (ONLINE), el temporizador se cancela y no pasa nada: eso cubre
# el parpadeo de cuando arranca una máquina grande en el taller. Si a los 3
# minutos sigue sin luz, se da la orden de apagado ordenado.
#
# Tres minutos es un valor de partida razonable con un SAI pequeño; ajústalo
# a la autonomía real que mida "upsc taller" con el aparato ya instalado
# (battery.runtime, en segundos). Deja siempre margen de sobra para que dé
# tiempo a apagar: al mini-PC le basta con menos de un minuto.

CMDSCRIPT /etc/nut/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

AT ONBATT  * START-TIMER apagado-por-corte 180
AT ONLINE  * CANCEL-TIMER apagado-por-corte vuelve-la-luz

# La batería baja no espera al temporizador: se apaga inmediatamente.
AT LOWBATT * EXECUTE apagado-inmediato

spring:
  application:
    name: herreria

  datasource:
    # 127.0.0.1 y no "localhost": en Windows localhost resuelve primero a ::1
    # (IPv6), donde puede haber un relay de WSL escuchando, y la conexión
    # acaba en un PostgreSQL que no es el del contenedor.
    # Puerto 5433: el 5432 lo ocupa el PostgreSQL nativo de Windows.
    # Debe coincidir con el mapeo de docker-compose.yml ("5433:5432").
    url: jdbc:postgresql://127.0.0.1:5433/herreria
    username: herreria
    password: cambiame   # debe coincidir con docker-compose.yml

  jpa:
    hibernate:
      # El esquema lo manda Flyway (src/main/resources/db/migration), no
      # Hibernate. "validate" comprueba al arrancar que las entidades y las
      # tablas concuerdan, y falla si no, pero no modifica nada.
      #
      # Antes esto era "update", que iba creando columnas solo. Cómodo mientras
      # se diseñaba, pero tenía un fallo silencioso: NO cambia el tipo de una
      # columna que ya existe. Un cambio de tipo se aplicaba en las entidades y
      # la base de datos se quedaba como estaba, sin avisar.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # La base de datos de desarrollo ya tenía las tablas cuando se introdujo
    # Flyway. baseline-on-migrate le dice que dé por aplicada la V1 en ese caso
    # en lugar de intentar crearlas otra vez. En el mini-PC la base nace vacía
    # y sencillamente se ejecutan las migraciones.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Esquema ya existente

  servlet:
    multipart:
      # Límite de subida: las fotos van dentro de la petición.
      # El total debe dar cabida a las 5 fotos que permite el negocio
      # (MAX_FOTOS), o subir un lote completo falla siempre.
      max-file-size: 10MB
      max-request-size: 60MB

server:
  port: 8080

# El servidor del taller no tiene a nadie delante: sin registro en fichero
# no hay forma de averiguar qué pasó en un fallo de primera hora.
logging:
  file:
    name: logs/herreria.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30      # un mes, igual que la copia de seguridad
  level:
    com.taller.herreria: INFO

taller:
  documento:
    # Encabezan los PDF de pedidos, trabajos y albaranes.
    # RELLENAR CON LOS DATOS REALES DEL TALLER antes de ponerlo en marcha:
    # un albarán que se entrega a un cliente los lleva siempre.
    nombre: Taller de herrería
    direccion: ""
    telefono: ""
    cif: ""

  cors:
    # Orígenes autorizados para la PWA, separados por comas.
    # En desarrollo, "ng serve" (4200). Cuando el servidor del taller tenga
    # IP fija, añadir aquí esa dirección.
    origenes: http://localhost:4200,http://127.0.0.1:4200

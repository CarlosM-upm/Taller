<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title th:text="'Trabajo ' + ${id}">Trabajo</title>
  <th:block th:replace="~{documentos/_comun :: estilo}" />
</head>
<body>

<th:block th:replace="~{documentos/_comun :: cabecera}" />
<th:block th:replace="~{documentos/_comun :: titulo('Trabajo realizado', ${id}, ${fecha})}" />

<table class="datos">
  <tr>
    <td class="etiqueta">Cliente</td>
    <td class="destacado" th:text="${cliente}">Cliente</td>
  </tr>
  <tr>
    <td class="etiqueta">Trabajador</td>
    <td th:text="${trabajador}">Trabajador</td>
  </tr>
  <tr>
    <td class="etiqueta">Horas</td>
    <td th:text="${horas}">Horas</td>
  </tr>
  <tr>
    <td class="etiqueta">Estado</td>
    <td th:text="${estado}">Estado</td>
  </tr>
</table>

<div class="bloque">
  <h2>Trabajo realizado</h2>
  <div class="texto" th:text="${descripcion}">Descripción</div>
</div>

<div class="bloque">
  <h2>Materiales empleados</h2>
  <div class="texto" th:text="${materiales}">Materiales</div>
</div>

<th:block th:replace="~{documentos/_comun :: fotos}" />
<th:block th:replace="~{documentos/_comun :: generado}" />

</body>
</html>

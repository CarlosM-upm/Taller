<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title th:text="'Trabajo ' + ${id}">Trabajo</title>
  <th:block th:replace="~{documentos/_comun :: estilo}" />
</head>
<body>

<th:block th:replace="~{documentos/_comun :: cabecera}" />
<th:block th:replace="~{documentos/_comun :: titulo('Trabajo realizado', ${id}, ${fecha})}" />

<table class="datos">
  <tr>
    <td class="etiqueta">Cliente</td>
    <td class="destacado" th:text="${cliente}">Cliente</td>
  </tr>
  <tr>
    <td class="etiqueta">Trabajador</td>
    <td th:text="${trabajador}">Trabajador</td>
  </tr>
  <tr>
    <td class="etiqueta">Horas</td>
    <td th:text="${horas}">Horas</td>
  </tr>
  <tr>
    <td class="etiqueta">Estado</td>
    <td th:text="${estado}">Estado</td>
  </tr>
</table>

<div class="bloque">
  <h2>Trabajo realizado</h2>
  <div class="texto" th:text="${descripcion}">Descripción</div>
</div>

<div class="bloque" th:if="${!#lists.isEmpty(materiales)}">
  <h2>Materiales empleados</h2>
  <table class="lineas">
    <tr>
      <th>Material</th>
      <th class="numero">Cantidad</th>
    </tr>
    <tr th:each="linea : ${materiales}">
      <td th:text="${linea.nombre}">Material</td>
      <td class="numero" th:text="${linea.cantidad}">0</td>
    </tr>
  </table>
</div>

<!-- La firma que el cliente pone en la obra, si ya la ha puesto. Si no, no se
     reserva hueco: el documento que se firma a mano es el albarán. -->
<div class="bloque firma-caja" th:if="${firma}">
  <div class="firma-titulo">Firma del cliente:</div>
  <img th:src="${firma}" alt="Firma del cliente" />
  <div class="firma-pie" th:text="${cliente}">Cliente</div>
</div>

<th:block th:replace="~{documentos/_comun :: fotos}" />
<th:block th:replace="~{documentos/_comun :: generado}" />

</body>
</html>

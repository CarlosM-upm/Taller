# Base de datos del taller.
# Arrancar con:  docker compose up -d
# Los datos persisten en el volumen "herreria_datos" aunque el contenedor se reinicie.
services:
  postgres:
    image: postgres:17
    container_name: herreria-db
    restart: unless-stopped        # se relanza solo al arrancar el servidor
    environment:
      POSTGRES_DB: herreria
      POSTGRES_USER: herreria
      # En desarrollo vale "cambiame". En el servidor del taller se pone la
      # contraseña real en un fichero .env junto a este docker-compose.yml
      # (POSTGRES_PASSWORD=...), que .gitignore excluye para que no acabe en
      # el repositorio. OJO: hay que ponerla ANTES del primer arranque; una
      # vez creado el volumen, cambiar esta variable ya no cambia nada
      # (ver DESPLIEGUE.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiame}
    ports:
      # 5433 en el equipo, 5432 dentro del contenedor.
      # El 5432 del equipo puede estar ocupado por un PostgreSQL nativo.
      - "5433:5432"
    volumes:
      - herreria_datos:/var/lib/postgresql/data

volumes:
  herreria_datos:
